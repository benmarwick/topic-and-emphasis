<meta name="claude:viewport-fit-sides" content="cover">
<title>Topic &amp; Emphasis</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,300..800;1,6..72,300..800&display=swap">
<style>
/* Layout: an editor's desk. Lens rail on the left, the manuscript sheet in the centre, margin notes on the right.
   A tapped sentence opens a workbench in the sheet, directly under its paragraph, where it is rewritten in place.
   Chrome is ink on paper; colour is reserved for what the lenses find. */
:root{
  --bg:#E8ECEB; --sheet:#FAFBF9; --ink:#15212B; --ink2:#4A5A66; --ink3:#7C8A94; --line:#CDD6D7; --chip:#DCE3E2;
  --amber:#A65800; --blue:#1D5FC4; --rose:#BF2460; --teal:#0A7A72; --violet:#6A3FD0; --olive:#55741A;
  --f-text:'Newsreader','Iowan Old Style',Georgia,serif;
  --f-ui:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1519; --sheet:#161E24; --ink:#E3E9EA; --ink2:#A9B6BD; --ink3:#77858E; --line:#2B363E; --chip:#222C34;
    --amber:#F2A64A; --blue:#82B1FF; --rose:#FF8CB0; --teal:#5DD3C6; --violet:#B8A1FF; --olive:#B5D975;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1519; --sheet:#161E24; --ink:#E3E9EA; --ink2:#A9B6BD; --ink3:#77858E; --line:#2B363E; --chip:#222C34;
  --amber:#F2A64A; --blue:#82B1FF; --rose:#FF8CB0; --teal:#5DD3C6; --violet:#B8A1FF; --olive:#B5D975;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:14px;line-height:1.5}
button,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.wrap{max-width:1320px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:22px 56px}

.hb-amber{--hb:var(--amber)}.hb-blue{--hb:var(--blue)}.hb-rose{--hb:var(--rose)}.hb-teal{--hb:var(--teal)}.hb-violet{--hb:var(--violet)}.hb-olive{--hb:var(--olive)}.hb-ink{--hb:var(--ink2)}
.hu-amber{--hu:var(--amber)}.hu-blue{--hu:var(--blue)}.hu-rose{--hu:var(--rose)}.hu-teal{--hu:var(--teal)}.hu-violet{--hu:var(--violet)}.hu-olive{--hu:var(--olive)}.hu-ink{--hu:var(--ink2)}

.top{display:flex;flex-wrap:wrap;gap:14px 28px;align-items:flex-end;justify-content:space-between;margin-bottom:22px}
.brand{min-width:0;flex:1 1 100%}
h1{font:500 2.1rem/1.05 var(--f-text);letter-spacing:-.012em;margin:0 0 6px}
h1 .t{background:color-mix(in srgb,var(--blue) 17%,transparent);padding:0 .12em}
h1 .s{background:color-mix(in srgb,var(--rose) 17%,transparent);padding:0 .12em}
h1 .amp{font-style:italic;color:var(--ink3);padding:0 .08em}
.brand p{margin:0;color:var(--ink2);text-wrap:pretty}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.btn{border:1px solid var(--line);background:var(--sheet);padding:7px 13px;border-radius:4px;cursor:pointer;font-weight:500}
.btn:hover{border-color:var(--ink3)}
.btn.primary{background:var(--ink);color:var(--sheet);border-color:var(--ink)}
.btn.sm{padding:4px 10px;font-size:12.5px}
.btn:disabled{opacity:.45;cursor:default}
.link{border:0;background:none;padding:0;color:var(--blue);cursor:pointer;text-decoration:underline;font-size:inherit}
select{border:1px solid var(--line);background:var(--sheet);border-radius:4px;padding:5px 8px;font-size:13px;max-width:100%}
.cap{font:500 11px/1.3 var(--f-mono);letter-spacing:.09em;text-transform:uppercase;color:var(--ink3);margin:0;display:block}

.desk{display:grid;grid-template-columns:216px minmax(0,1fr) 336px;gap:26px;align-items:start}
.rail,.notes{position:sticky;top:calc(12px + env(safe-area-inset-top,0px));max-height:calc(100vh - 24px);overflow:auto}
.rail h2,.notes h2{font:500 11px/1.3 var(--f-mono);letter-spacing:.09em;text-transform:uppercase;color:var(--ink3);margin:0 0 8px}
.rail details{margin-top:18px}
.rail summary{list-style:none;cursor:pointer}
.rail summary::-webkit-details-marker{display:none}
.rail summary h2::after{content:" +"}
.rail details[open] summary h2::after{content:""}
.lensgroup{display:flex;flex-direction:column;gap:2px}
.lens{display:flex;align-items:center;gap:9px;width:100%;text-align:left;border:0;background:transparent;padding:7px 9px;border-radius:4px;cursor:pointer;min-width:0}
.lens:hover{background:var(--chip)}
.lens i{flex:none;width:9px;height:9px;border-radius:50%;background:var(--hb)}
.lens span{flex:1 1 auto;min-width:0}
.lens b{flex:none;font:500 12px var(--f-mono);color:var(--ink3);font-variant-numeric:tabular-nums;white-space:nowrap}
.lens b s{text-decoration:none;opacity:.6}
.lens[aria-pressed="true"]{background:var(--sheet);box-shadow:inset 0 0 0 1px var(--line),inset 3px 0 0 var(--hb);font-weight:600}
.lens[aria-pressed="true"] b{color:var(--ink)}

.center{min-width:0;display:flex;flex-direction:column;gap:14px}
.lenscard{display:grid;gap:6px}
.lenscard .src{font:500 11px/1.3 var(--f-mono);letter-spacing:.09em;text-transform:uppercase;color:var(--hb)}
.lenscard h2{font:500 1.45rem/1.15 var(--f-text);margin:0}
.lenscard p{margin:0;color:var(--ink2);text-wrap:pretty}
.lenscard p b{color:var(--ink);font-weight:600}
.lenscard textarea{width:100%;max-width:66ch;background:var(--sheet);border:1px solid var(--line);border-radius:3px;padding:8px 10px;font:400 1.05rem/1.5 var(--f-text);resize:vertical}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12.5px;color:var(--ink2);margin-top:2px}
.legend .mk{font-family:var(--f-text);font-size:15px;color:var(--ink);cursor:default}

.stripwrap{display:grid;gap:4px}
.readout{font:400 12px/1.4 var(--f-mono);color:var(--ink2);font-variant-numeric:tabular-nums;display:flex;flex-wrap:wrap;gap:4px 14px;align-items:center}
.readout .btn{font-family:var(--f-ui);margin-left:auto}
.strip{position:relative;display:flex;align-items:flex-end;gap:9px;height:54px;overflow-x:auto;border-bottom:1px solid var(--line)}
.strip .pg{display:flex;align-items:flex-end;gap:2px;height:100%;flex:1 1 0;min-width:0}
.bar{flex:1 1 0;min-width:2px;height:var(--h);min-height:2px;background:var(--ink3);opacity:.55;border:0;padding:0;border-radius:1px 1px 0 0;cursor:pointer}
.bar.on{background:var(--hb);opacity:1}
.bar.sel{box-shadow:0 0 0 2px var(--bg),0 0 0 3px var(--ink)}
.strip .ref{position:absolute;left:0;right:0;bottom:var(--y);border-top:1px dashed var(--line);pointer-events:none}
.strip .ref span{position:absolute;right:0;top:-14px;font:10px var(--f-mono);color:var(--ink3);background:var(--bg);padding-left:4px}

#extra:empty{display:none}
#extra{display:grid;gap:10px;min-width:0}
.panel{background:var(--sheet);border:1px solid var(--line);border-radius:3px;padding:12px 14px;display:grid;gap:8px;min-width:0}
.panel p{margin:0;color:var(--ink2);font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:3px 10px;cursor:pointer;font-size:13px}
.chip b{font:500 11px var(--f-mono);color:var(--ink3);margin-left:3px}
.chip.on{border-color:var(--amber);background:color-mix(in srgb,var(--amber) 16%,transparent)}
.chip.zero{border-style:dashed;color:var(--ink3)}
.seq{display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center;font:400 12px var(--f-mono);color:var(--ink2)}
.seq span{border:1px solid var(--line);border-radius:3px;padding:2px 7px;background:var(--bg)}
.seq span.none{border-style:dashed;color:var(--ink3)}
.panel details summary{cursor:pointer;font-size:13px;color:var(--ink2)}
.panel details .chips{margin-top:8px}
.tblwrap{overflow-x:auto}
table.cmp{border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums;min-width:260px}
table.cmp th,table.cmp td{text-align:left;padding:3px 14px 3px 0;border-bottom:1px solid var(--line)}
table.cmp th{font:500 11px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink3)}
table.cmp td.n{text-align:right;font-family:var(--f-mono)}
table.cmp td.dn{color:var(--teal)}table.cmp td.up{color:var(--rose)}
.diff{background:var(--sheet);border:1px solid var(--line);border-radius:3px;padding:24px clamp(16px,4vw,40px);font:400 1.1rem/1.75 var(--f-text);white-space:pre-wrap;overflow-wrap:break-word}
del{color:var(--rose);background:color-mix(in srgb,var(--rose) 10%,transparent);text-decoration:line-through}
ins{color:var(--teal);background:color-mix(in srgb,var(--teal) 14%,transparent);text-decoration:none}

.ms{background:var(--sheet);border:1px solid var(--line);border-radius:3px;padding:30px clamp(18px,4vw,44px) 34px;font:400 1.19rem/1.78 var(--f-text);min-width:0}
.pblock{margin:0 0 1.05em}
.pblock:last-of-type{margin-bottom:0}
.ms .para{margin:0;max-width:38em;overflow-wrap:break-word}
.ms .para.head{font:600 .78rem/1.4 var(--f-ui);letter-spacing:.06em;text-transform:uppercase;color:var(--ink2)}
.ms .sampletag{font:500 11px/1.4 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);margin:0 0 14px}
.padorn{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;font:400 12px/1.5 var(--f-mono);color:var(--ink2);margin:0 0 4px}
.padorn .pn{color:var(--ink3)}
.padorn select{font-family:var(--f-ui)}
.padorn .hit{color:var(--blue)}
.tstring{display:block;font:400 12px/1.5 var(--f-mono);color:var(--blue);margin:0 0 4px}
.gapbtn{display:inline-block;font:400 12px/1.3 var(--f-mono);color:var(--ink3);border:1px dashed var(--line);background:transparent;border-radius:3px;padding:2px 8px;margin:0 .4em;cursor:pointer;vertical-align:.15em}
.sent{border-radius:2px;cursor:pointer}
.sent.sel{background:color-mix(in srgb,var(--ink) 7%,transparent);box-shadow:0 0 0 3px color-mix(in srgb,var(--ink) 7%,transparent)}
.sn{font:500 .56em/1 var(--f-mono);vertical-align:.75em;margin-right:.3em;padding:.18em .38em;border-radius:3px;border:0;background:var(--chip);color:var(--ink2);cursor:pointer;font-variant-numeric:tabular-nums}
.sn.on{background:var(--hb);color:var(--sheet)}
.mk.hl{background:color-mix(in srgb,var(--hb) 19%,transparent)}
.mk.hl2{background:color-mix(in srgb,var(--hb) 9%,transparent)}
.mk.ul{text-decoration:underline solid var(--hu) 2px;text-underline-offset:.22em}
.mk.dot{text-decoration:underline dotted var(--hu) 2px;text-underline-offset:.22em}
.mk.wav{text-decoration:underline wavy var(--hu) 1.5px;text-underline-offset:.22em}
.mk.st{font-weight:600}
.mk.fl{background:color-mix(in srgb,var(--hb) 12%,transparent);box-shadow:inset 0 -2px 0 var(--hb)}
.mk[data-f]{cursor:pointer}
.sent{-webkit-box-decoration-break:clone;box-decoration-break:clone}
.sent.lb0,.mk.lb0{background:color-mix(in srgb,var(--teal) 17%,transparent)}
.mk.lb1{box-shadow:inset 0 0 0 1px var(--line)}
.sent.lb2,.mk.lb2{background:color-mix(in srgb,var(--amber) 15%,transparent)}
.sent.lb3,.mk.lb3{background:color-mix(in srgb,var(--rose) 20%,transparent)}
.mk.lb{padding:0 3px;border-radius:2px}
.sent.rn,.mk.rn{text-decoration-line:underline;text-decoration-thickness:2px;text-underline-offset:.42em}
.rn-even{text-decoration-style:solid;text-decoration-color:var(--ink3)}
.rn-chop{text-decoration-style:dashed;text-decoration-color:var(--teal)}
.rn-long{text-decoration-style:double;text-decoration-color:var(--rose)}
.strip.tall{height:96px}
.bar.rb{opacity:1;background:linear-gradient(to top,var(--hb) 0 var(--p),color-mix(in srgb,var(--hb) 36%,var(--bg)) var(--p) 100%)}
.bar.rb.on{box-shadow:0 0 0 1px var(--bg),0 0 0 2px var(--ink2)}
.bar.rb.sel{box-shadow:0 0 0 2px var(--bg),0 0 0 3px var(--ink)}
.bar.rb.over{border-top:4px double var(--bg)}
.vbar.lbar .b0{background:var(--teal)}.vbar.lbar .b1{background:var(--ink3)}.vbar.lbar .b2{background:var(--amber)}.vbar.lbar .b3{background:var(--rose)}
.padorn label{font-family:var(--f-ui);font-size:12.5px;cursor:help}
.padorn .emphsel{max-width:min(100%,22em)}
.padorn .miss,.padorn .ct-level{color:var(--amber)}
.padorn .ct-varied{color:var(--teal)}
table.cmp.rt td,table.cmp.rt th{white-space:nowrap}
table.cmp.rt tr.r-all td{font-weight:600}
table.cmp.rt tr.r-was td{color:var(--ink3)}
.rguide p{margin-top:9px!important;text-wrap:pretty}
.rguide p b{color:var(--ink);font-weight:600}
.rguide a,.panel a[data-ref]{color:var(--blue)}
.sn.lk-fluid{box-shadow:inset 0 -2px 0 var(--teal)}
.sn.lk-inverted,.sn.lk-outofsync{background:color-mix(in srgb,var(--amber) 22%,var(--chip));color:var(--ink)}
.sn.lk-disconnected{background:color-mix(in srgb,var(--rose) 24%,var(--chip));color:var(--ink)}
.bar.lk-fluid{background:var(--teal);opacity:.75}.bar.lk-inverted,.bar.lk-outofsync{background:var(--amber);opacity:.85}.bar.lk-disconnected{background:var(--rose);opacity:.9}
table.gridt{border-collapse:collapse;font-size:12px}
table.gridt th,table.gridt td{padding:2px 0;text-align:center;min-width:19px;height:22px;font:400 11px var(--f-mono);color:var(--ink3)}
table.gridt thead th{border-bottom:1px solid var(--line);padding:2px 4px}
table.gridt tbody th{text-align:left;padding-right:8px;white-space:nowrap;position:sticky;left:0;background:var(--sheet)}
table.gridt tbody tr+tr th,table.gridt tbody tr+tr td{border-top:1px solid color-mix(in srgb,var(--line) 55%,transparent)}
table.gridt .pb{border-left:2px solid var(--line)}
table.gridt td.gl{color:var(--teal);font-size:13px;cursor:help}table.gridt td.gr{color:var(--ink3);font-size:13px;cursor:help}
table.gridt .chip{padding:1px 8px;font-size:12px}
.chip.on{color:var(--ink)}
.lks{display:flex;flex-wrap:wrap;gap:5px 8px;font:400 12px var(--f-mono)}
.lkc{border-radius:3px;padding:2px 8px;border:1px solid var(--line);cursor:help}
.lkc.lk-fluid{border-color:var(--teal);color:var(--teal)}.lkc.lk-inverted,.lkc.lk-outofsync{border-color:var(--amber);color:var(--amber)}.lkc.lk-disconnected{border-color:var(--rose);color:var(--rose)}
.panel select{max-width:100%;font:inherit;padding:4px 6px;justify-self:start}
ol.keys{margin:0;padding-left:1.3em;display:grid;gap:6px;font:400 .98rem/1.5 var(--f-text);color:var(--ink)}
ol.keys .link{font:500 12px var(--f-ui)}
ol.keys .kn{font:400 11px var(--f-mono);color:var(--blue);white-space:nowrap}
.pr .toks{color:var(--ink)}
.prlead{margin:4px 0 0!important;font:400 1.05rem/1.6 var(--f-text)!important;color:var(--ink)!important}
.prcard{display:flex;gap:10px;align-items:baseline;width:100%;text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:4px;padding:9px 12px;cursor:pointer;font:400 1.02rem/1.55 var(--f-text);color:var(--ink)}
.prcard b{font:600 12px var(--f-mono);color:var(--violet)}
.prcard.on{border-color:var(--violet);background:color-mix(in srgb,var(--violet) 10%,transparent)}
.prcard:disabled{cursor:default}
.prout{margin:6px 0 0!important;font-weight:600;color:var(--amber)!important}
.prout.ok{color:var(--teal)!important}
.tk:disabled{cursor:default}
.lenscard textarea+label{margin-top:6px}
.tagline{font:500 1.05rem/1.4 var(--f-text);color:var(--ink)!important;margin:0 0 8px!important}
.brand .invite,.brand .caution{margin-top:8px;font-size:13.5px}
.brand .caution{border-left:3px solid var(--line);padding-left:10px}
.brand .caution b{color:var(--ink);font-weight:600}
.brand a{color:var(--blue)}
.railmore{border:0;background:none;color:var(--ink3);font:400 12px var(--f-ui);padding:5px 9px;text-align:left;cursor:pointer}
.railmore:hover{color:var(--ink)}
.readout .btn+.btn{margin-left:0}
.clean .ms .para .mk{background:none!important;box-shadow:none!important;text-decoration:none!important;font-weight:inherit!important;animation:none!important}
.clean .ms .para .sent{background:none!important;text-decoration:none!important;animation:none!important}
.clean .ms .sn,.clean .padorn,.clean .tstring,.clean .pdone,.clean .moves,.clean #extra,.clean .legend,.clean .strip{display:none}
.clean .ms .para.settled{border-left:0;padding-left:0;margin-left:0}
.panel.start{border:1px solid var(--ink3);border-left:6px solid var(--ink);padding:18px 20px;gap:11px;box-shadow:0 3px 0 var(--line)}
.starth{font:500 1.7rem/1.1 var(--f-text);letter-spacing:-.01em;margin:0;color:var(--ink);cursor:help}
.panel.start p{font-size:14px;color:var(--ink)}
.pt-bars i{cursor:help}
.start .btn.sm{font-size:13.5px;padding:6px 12px}
.start .row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.start .row>span{font-size:12.5px;color:var(--ink2)}
.portraits{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.portrait{display:grid;gap:5px;min-width:0}
.pt-row{display:grid;grid-template-columns:86px minmax(0,1fr);gap:8px;align-items:end;font:400 11px var(--f-mono);color:var(--ink3)}
.pt-row>span{cursor:help;line-height:1.2}
.pt-bars{display:flex;align-items:flex-end;gap:1px;height:26px;min-width:0}
.pt-bars i{flex:1 1 0;min-width:1px;height:var(--h,100%);background:var(--ink3);border-radius:1px 1px 0 0}
.pt-bars i.pb{margin-left:4px}
.pt-bars i.b0{background:var(--teal)}.pt-bars i.b2{background:var(--amber)}.pt-bars i.b3{background:var(--rose)}
.pt-bars i.w1{opacity:.55}.pt-bars i.w2{background:var(--amber)}.pt-bars i.w3{background:var(--rose)}
.pt-bars.sqs{height:12px}
.pt-bars i.sq{height:10px;border-radius:1px}
.pt-bars i.lk-start{opacity:.3}.pt-bars i.lk-fluid{background:var(--teal)}.pt-bars i.lk-inverted,.pt-bars i.lk-outofsync{background:var(--amber)}.pt-bars i.lk-disconnected{background:var(--rose)}
.pt-bars i.n0{background:var(--teal);opacity:.35}.pt-bars i.n1{background:var(--ink3);opacity:.45}.pt-bars i.n2{background:var(--amber)}.pt-bars i.n3{background:var(--rose)}
ul.obs{margin:0;padding-left:1.1em;font-size:13px;color:var(--ink2);display:grid;gap:3px}
.cause{margin:0 0 6px;font-size:13px;color:var(--ink);background:color-mix(in srgb,var(--amber) 10%,transparent);border-left:3px solid var(--amber);padding:6px 10px;border-radius:0 3px 3px 0}
details.morenotes{margin-top:8px}
details.morenotes>summary{cursor:pointer;font-size:13px;color:var(--blue);padding:4px 0}
.pv{margin-top:8px;border:1px dashed var(--hb,var(--line));border-radius:4px;padding:8px 10px;display:grid;gap:6px;background:var(--bg)}
.pv p{margin:0;font-size:13px}
.scrub{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:center}
.scrub input{width:100%;accent-color:var(--ink2)}
.scrub span{font:400 11px var(--f-mono);color:var(--ink3);white-space:nowrap}
.delta.aside{color:var(--ink2);font-style:italic}
.delta.aside a{color:var(--blue)}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:80;max-width:min(92vw,460px);background:var(--ink);color:var(--sheet);padding:10px 16px;border-radius:999px;font:500 13.5px/1.35 var(--f-ui);box-shadow:0 8px 24px rgba(0,0,0,.3);cursor:pointer;text-align:center}
@media (prefers-reduced-motion:no-preference){.toast{animation:toast .45s cubic-bezier(.2,.8,.2,1)}@keyframes toast{0%{opacity:0;transform:translate(-50%,14px)}}}
.bar.calm:not(.rb):not(.on){background:var(--teal);opacity:.5}
.pdone{font:500 .62em/1 var(--f-mono);letter-spacing:.04em;color:var(--teal);white-space:nowrap;margin-left:.2em;opacity:.8;cursor:help;display:inline-block}
.pdone.all{opacity:1;border:1px solid color-mix(in srgb,var(--teal) 45%,transparent);border-radius:999px;padding:.28em .6em;vertical-align:.12em}
