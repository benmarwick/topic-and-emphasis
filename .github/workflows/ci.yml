# Tests on every push and pull request. On a push to main that passes, the site is published to GitHub Pages.
# For the deploy job to work, set Settings > Pages > Build and deployment > Source to "GitHub Actions".
name: Test and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build the page from src/
        run: python3 build.py
      - name: The committed index.html is the built page
        run: git diff --exit-code -- index.html
      - name: Rule engine and interface tests
        run: |
          set -e
          for t in tests/*.js; do
            echo "== $t"
            node "$t"
          done

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Gather what the site serves
        run: |
          mkdir _site
          cp -r index.html data lib model docs LICENSE README.md _site/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
      # The deploy step sometimes fails for no reason of ours. Try once more before giving up.
      - name: Deploy again if the first try failed
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
